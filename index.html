<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сазанчик — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-950:#2a0d13;
    --wine-900:#3a1219;
    --wine-800:#4d1b23;
    --gold-500:#b8892f;
    --gold-400:#cf9f45;
    --gold-200:#e6c98a;
    --paper-050:#f6efe0;
    --paper-100:#efe5cf;
    --ink-900:#241610;
    --ink-700:#4a352a;
    --line:rgba(36,22,16,0.18);
    --cream:#efe5cf;
    --cream-hi:#f6efe0;
    --nav-h:64px;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:var(--nav-h);-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper-050);
    color:var(--ink-900);
    font-family:'PT Sans', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Old Standard TT', Georgia, 'Times New Roman', serif;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(ellipse at 30% -10%, var(--wine-800), var(--wine-950) 65%);
    color:var(--cream-hi);
    overflow:hidden;
    padding:calc(56px + env(safe-area-inset-top,0px)) 24px 64px;
  }
  .scale-pattern{
    position:absolute; inset:0;
    opacity:0.14;
    background-image:
      radial-gradient(circle at 50% 100%, transparent 62%, var(--gold-400) 63%, var(--gold-400) 64%, transparent 65%);
    background-size:46px 34px;
    background-position:0 0, 23px 17px;
    mask-image:linear-gradient(to bottom, black, transparent 92%);
  }
  .hero-inner{
    position:relative;
    max-width:760px;
    margin:0 auto;
    text-align:center;
  }
  .fish-mark{
    width:64px; height:auto; margin:0 auto 18px;
    display:block;
    color:var(--gold-400);
  }
  .logo{display:block; width:min(420px,84%); height:auto; margin:0 auto 22px;}
  .logo-foot{width:min(220px,60%); margin-bottom:14px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .hero h1{
    font-size:clamp(2.6rem, 8vw, 4.4rem);
    font-weight:700;
    letter-spacing:0.01em;
    margin:0 0 6px;
    color:var(--cream-hi);
  }
  .hero .subtitle{
    font-family:'PT Sans', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.35em;
    font-size:0.72rem;
    color:var(--gold-200);
    margin:0 0 22px;
  }
  .hero p.tag{
    font-style:italic;
    font-family:'Old Standard TT', serif;
    font-size:1.15rem;
    color:var(--cream);
    max-width:480px;
    margin:0 auto;
    line-height:1.5;
    opacity:0.9;
  }
  .hero-divider{
    width:120px; height:1px;
    background:linear-gradient(to right, transparent, var(--gold-400), transparent);
    margin:26px auto 0;
  }

  /* ---------- NAV ---------- */
  .nav-wrap{
    position:sticky; top:0; z-index:20; position:-webkit-sticky; position:sticky;
    background:var(--wine-950);
    border-bottom:1px solid rgba(207,159,69,0.35);
  }
  nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
    max-width:1000px;
    margin:0 auto;
    scrollbar-width:none;
    position:relative;
    overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    background:transparent;
    border:1px solid transparent;
    color:var(--cream);
    font-family:'PT Sans', sans-serif;
    font-size:0.82rem;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    opacity:0.75;
    transition:opacity .2s, background .2s, color .2s;
  }
  nav button:hover{opacity:1;}
  nav button:focus-visible{outline:2px solid var(--gold-400); outline-offset:2px;}
  nav button.active{
    background:var(--gold-400);
    color:var(--wine-950);
    opacity:1;
    font-weight:700;
  }

  /* ---------- CONTENT ---------- */
  main{
    max-width:760px;
    margin:0 auto;
    padding:8px 20px 40px;
  }
  section.category{
    padding-top:44px;
    scroll-margin-top:var(--nav-h);
  }
  section.category:first-of-type{padding-top:36px;}
  .cat-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:6px;
  }
  .cat-head h2{
    font-size:1.55rem;
    font-weight:700;
    color:var(--wine-900);
    margin:0;
    white-space:nowrap;
  }
  .cat-head .rule{
    flex:1;
    height:1px;
    background:var(--gold-500);
    opacity:0.55;
  }
  .cat-note{
    font-size:0.85rem;
    font-style:italic;
    color:var(--ink-700);
    margin:0 0 14px;
  }
  ul.items{
    list-style:none;
    margin:0 0 10px;
    padding:0;
  }
  li.item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .item-body{flex:1; min-width:0;}
  .item-main{display:flex; align-items:baseline; gap:8px;}
  .item-desc{font-size:.78rem; line-height:1.4; color:var(--ink-700); opacity:.8; margin-top:3px; padding-right:4px;}
  .thumb{
    flex:0 0 68px; width:68px; height:68px;
    border-radius:10px; overflow:hidden;
    display:grid; place-items:center;
    color:var(--gold-500);
    background:rgba(184,137,47,0.08);
    border:1px dashed rgba(184,137,47,0.6);
  }
  .thumb{position:relative;}
  .thumb svg{width:26px; height:26px; opacity:.75;}
  .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .25s;}
  .thumb.has-img{border:none; background:none;}
  .thumb.has-img img{opacity:1;}
  .thumb.has-img svg{display:none;}
  li.item:last-child{border-bottom:none;}
  .item-name{
    font-size:1rem;
    line-height:1.35;
  }
  .item-weight{
    font-size:0.78rem;
    color:var(--ink-700);
    opacity:0.75;
    white-space:nowrap;
  }
  .item-leader{
    flex:1;
    border-bottom:1px dotted var(--gold-500);
    min-width:16px;
    transform:translateY(-4px);
    opacity:0.6;
  }
  .item-price{
    font-family:'Old Standard TT', serif;
    font-weight:700;
    font-size:1rem;
    white-space:nowrap;
    flex:none;
    color:var(--wine-900);
  }
  .item-price small{
    font-family:'PT Sans', sans-serif;
    font-weight:400;
    font-size:0.72rem;
    color:var(--ink-700);
  }

  .hero-info{margin:22px auto 0; max-width:520px; display:grid; gap:8px; justify-items:center; font-size:.92rem; color:var(--cream);}
  .hi-branch{display:grid; gap:6px; justify-items:center;}
  .hi-name{font-family:'Old Standard TT',serif; font-weight:700; color:var(--gold-200); margin-bottom:2px;}
  .hi-row{display:flex; align-items:flex-start; gap:8px; text-align:left; line-height:1.4;}
  .hi-row svg{flex:0 0 16px; width:16px; height:16px; margin-top:2px; color:var(--gold-400);}
  .hi-row a{color:inherit; text-decoration:underline; text-decoration-color:rgba(207,159,69,.6); text-underline-offset:3px;}
  .hi-row small{opacity:.75; font-size:.82em;}
  .hi-row.ph{opacity:.55; font-style:italic;}
  .hi-socials{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px;}
  .hi-social{display:inline-flex; align-items:center; gap:8px; padding:6px 13px 6px 6px; border-radius:22px; border:1px solid rgba(207,159,69,.6); color:var(--cream); text-decoration:none; font-size:.85rem;}
  a.hi-social:hover{background:var(--gold-400); color:var(--wine-950);}
  .hi-social .ico{width:22px; height:22px; border-radius:50%; background:var(--gold-400); color:var(--wine-950); display:grid; place-items:center; font-size:.6rem; font-weight:700;}
  .hi-social.empty{opacity:.5; border-style:dashed;}
  footer{
    background:var(--wine-950);
    color:var(--cream);
    text-align:center;
    padding:34px 20px calc(34px + env(safe-area-inset-bottom,0px));
  }
  footer .fish-mark{width:34px; margin-bottom:12px;}
  footer p{
    margin:4px 0;
    font-size:0.85rem;
    line-height:1.6;
  }
  footer p.warn{
    color:var(--gold-200);
    max-width:420px;
    margin:14px auto 0;
    font-size:0.8rem;
  }

  @media (prefers-color-scheme: dark){
    body{ background:#17100c; color:#ece2ce; }
    :root{ --paper-050:#17100c; --paper-100:#1f1712; --line:rgba(230,201,138,0.16); --ink-900:#ece2ce; --ink-700:#c9b89b; }
    .cat-head h2{ color:var(--gold-200); }
    .item-price{ color:var(--gold-200); }
  }

  @media (max-width:480px){
    .cat-head h2{font-size:1.3rem;}
    .item-price{font-size:0.92rem;}
  }
</style>
</head>

function attachPhoto(th, urls, alt){
  const img = document.createElement('img');
  img.alt = alt; img.loading = 'lazy'; img.decoding = 'async';
  let k = 0;
  img.onload = ()=> th.classList.add('has-img');
  img.onerror = ()=>{ k++; if(k < urls.length) img.src = urls[k]; else img.remove(); };
  img.src = urls[0];
  th.appendChild(img);
}

// ====== ПРОКРУТКА ======
const navButtons = Array.from(nav.querySelectorAll('button'));
const sections = navButtons.map(b=>document.getElementById(b.dataset.target));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let navH = 64, current = null, locked = false, lockTimer = null, ticking = false;

function measure(){
  navH = navWrap.offsetHeight;
  document.documentElement.style.setProperty('--nav-h', navH + 'px');
}

function setActive(id){
  if(id === current) return;
  current = id;
  navButtons.forEach(b=>{
    const on = b.dataset.target === id;
    b.classList.toggle('active', on);
    if(on){
      // двигаем только ленту меню — страницу не трогаем
      nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth)/2, behavior: reduce ? 'auto' : 'smooth' });
    }
  });
}

function update(){
  ticking = false;
  const line = navH + 24;
  let id = sections[0].id;
  for(const s of sections){
    if(s.getBoundingClientRect().top <= line) id = s.id; else break;
  }
  if(window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) id = sections[sections.length-1].id;
  setActive(id);
}

function unlock(){ locked = false; update(); }

function goTo(id){
  const el = document.getElementById(id);
  setActive(id);
  locked = true;
  clearTimeout(lockTimer);
  lockTimer = setTimeout(unlock, 400);
  const y = el.getBoundingClientRect().top + window.scrollY - navH;
  window.scrollTo({ top: Math.max(0, y), behavior: reduce ? 'auto' : 'smooth' });
}

addEventListener('scroll', ()=>{
  if(locked){ clearTimeout(lockTimer); lockTimer = setTimeout(unlock, 150); return; }
  if(!ticking){ ticking = true; requestAnimationFrame(update); }
}, { passive:true });
// пользователь сам взялся за прокрутку — сразу отдаём управление
['wheel','touchstart','keydown'].forEach(ev=>addEventListener(ev, ()=>{ if(locked){ locked = false; } }, { passive:true }));
addEventListener('resize', ()=>{ measure(); update(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ measure(); update(); });
measure(); update();
